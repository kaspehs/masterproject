method: latent_rnn

data:
  cut_start_seconds_train: 0.0
  cut_start_seconds_val: 0.0
  reduce_time: true
  reduction_factor: 20
  stagger_reduced_time_train: false
  stagger_reduced_time_val: false
  train_series_dir: CFD_Data/npz_exports_td_burnin_trimmed

model:
  rho: 1.0
  D: 1.0
  structural_mass: 16.79
  Ca: 1.0
  k: 1218.0
  damping_c: 1e-4
  force_output: coefficient
  coefficient_output_bound: 2.0
  sigma_min: 1.0e-6
  input_scaling_mode: current
  ur_scale: 10.0

architecture:
  hard_force_symmetry: false
  shared_td_correction_trunk: true
  use_fourier_features: false
  fourier_features: 64
  fourier_sigma: 1.0
  force_net_type: pirate
  residual_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  mlp_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  pirate_force_kwargs:
    depth: 2
    fourier_features: 64
    sigma: 1.0
    use_rwf: false
    activation: gelu

training:
  batch_size: 256
  max_grad_norm: 200.0
  epochs: 500

optim:
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  use_lr_scheduler: true
  scheduler:
    max_lr: 0.001
    decay_rate: 0.99
    warmup_fraction: 0.05
    min_lr: 0.0001
    scheduler_type: cosine

loss:
  mean_reg: 0.0
  mean_reg_norm: l1
  sigma_reg: 0.0
  sigma_reg_norm: l2
  fhat_reg: 0.0
  fhat_reg_norm: l2

  ur_bin_size: 1.0e-6
  normalize_by_ur_bin_std: false
  ur_bin_scale_eps: 1.0e-6
  state_weight: 1.0

  rollout_det_weight: 0.0
  rollout_det_steps: 250
  rollout_loss_mode: deterministic
  rollout_stochastic_samples: 1
  rollout_det_steps_final: 0
  rollout_det_steps_warmup_epochs: 0
  rollout_det_batch_size: 256
  rollout_det_amplitude_normalized_mse: false
  rollout_relative_losses: true
  rollout_disp_std_weight: 0.0
  rollout_disp_std_normalize_by_true: null
  rollout_disp_std_p: 2.0
  rollout_disp_mean_in_std_loss: true
  rollout_disp_spectral_weight: 1.0
  rollout_disp_spectral_loss: dominant_frequency
  rollout_disp_psd_weight: 0.0
  rollout_disp_psd_peak_rel_bandwidth: 0.0
  rollout_disp_psd_use_hann_window: true
  rollout_disp_freq_p: 1.0
  rollout_disp_freq_alpha: 12.0

  use_force_data_loss: false
  force_data_weight: 0.0
  symmetry_weight: 0.0
  symmetry_norm: l2

  use_gradnorm: false
  gradnorm_alpha: 0.9
  gradnorm_min_weight: 0.001
  gradnorm_max_weight: 1000.0

runtime:
  device: cuda
  num_workers: 4

precision:
  use_tf32: false
  use_amp: false
  amp_dtype: bf16

compile:
  use_compile: false
  compile_mode: reduce-overhead

monitoring:
  validate_every_epochs: 10
  validation_samples_per_ur: 2
  final_rollout_all_validation: true
  log_every_epochs: 5
  print_every_epochs: 50
  log_component_grad_norms: false
  async_validation: false
  async_validation_device: cpu
  async_validation_num_workers: 0
  async_validation_num_threads: 1
  async_validation_max_concurrent: 6
  surrogate_validation_enabled: true
  surrogate_validation_npz: CFD_Data/analysis/surrogate_validation_points.npz
  surrogate_validation_tag: val_surrogate
  combined_validation_tag: val

logging:
  run_dir_root: logs
  run_name: null
  append_timestamp: true

latent_rnn:
  latent_dim: 3
  encoder_length: 50
  encoder_type: gru
  encoder_hidden: 128
  encoder_layers: 1
  encoder_dropout: 0.0
  encoder_include_acceleration: true
  latent_update: dt_scaled
  latent_time_scale: auto
  # Uses this mass convention for structural state/U_r scaling only; no TD dynamics are used.
  td_mass_source: dry
  corr_init_mode: zero

hnn: {}
pinn: {}
vpinn: {}
