method: hnn

data:
  file: data.npz
  steadystate: false
  steadystate_time_threshold: 10.0
  cut_start_seconds: 0.0
  cut_start_seconds_train: 0.0
  cut_start_seconds_val: 0.0
  reduce_time: true
  reduction_factor: 8
  middle_time_plot: [15, 17]
  use_generated_train_series: true
  train_series_dir: Experimental_Data/CF_corrected_v3

model:
  rho: 1000.0
  D: 0.1
  structural_mass: 16.79
  Ca: 1.0
  k: 1218.0
  U: 0.65
  damping_c: 1e-4
  max_damping_ratio: 0.2
  include_physical_drag: false
  force_output: coefficient
  learn_hamiltonian: false
  discover_damping: false
  use_pirate_force: false
  pirate_force_kwargs: {}
  use_fourier_features: false
  fourier_features: 64
  fourier_sigma: 1.0
  use_feature_engineering: false
  # Learn heteroscedastic process noise in the momentum channel (PHNN-only).
  use_stochastic_process_noise: true
  sigma_min: 1.0e-6
  # History-augmented PHNN (base Markovian + optional TCN correction).
  use_history_tcn: true
  history_window: 25
  history_tcn_channels: 8
  history_tcn_layers: 3
  history_tcn_kernel_size: 4
  history_tcn_dropout: 0.05
  # Turn residual correction on/off: a = a_base + delta_a
  use_history_correction: true
  # Sigma source: false -> Markovian sigma_net, true -> history-dependent sigma_net
  sigma_from_history: false
  # Correction head init: zero | tiny | standard
  corr_init_mode: zero
  corr_init_tiny_std: 1.0e-4
  ur_scale: 10.0

smoothing:
  use_savgol_smoothing: true
  window_length: 7
  polyorder: 3

architecture:
  force_net_type: mlp
  residual_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  mlp_kwargs:
    hidden: 128
    layers: 3
    activation: gelu
  pirate_force_kwargs:
    depth: 2
    fourier_features: 64
    sigma: 0.5
    use_rwf: false
    activation: gelu

training:
  batch_size: 8192
  max_grad_norm: 20.0
  epochs: 2000

optim:
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  use_lr_scheduler: true
  scheduler:
    max_lr: 0.001
    decay_rate: 0.99
    warmup_fraction: 0.05
    min_lr: 0.0001
    scheduler_type: cosine

loss:
  # Mean-force regularization weight (independent of sigma regularization).
  mean_reg: 0.0
  # Norm for mean-force regularizer: l1 | l2
  mean_reg_norm: l1
  # Sigma regularization weight (for stochastic PHNN this regularizes diffusion sigma).
  force_reg: 0.1
  # Norm for sigma regularizer: l1 | l2
  sigma_reg_norm: l2
  # Optional deterministic multi-step rollout loss (mean/drift only, no sigma sampling).
  rollout_det_weight: 0.0
  rollout_det_steps: 0
  # Optional linear schedule for rollout length. <=0 keeps rollout_det_steps fixed.
  rollout_det_steps_final: 0
  rollout_det_steps_warmup_epochs: 0
  # Batch size for deterministic rollout loss windows (<=0 uses training.batch_size).
  rollout_det_batch_size: 0
  # If true, mean regularizer is applied on force coefficient instead of force units.
  force_reg_on_coeff: true
  use_force_data_loss: false
  force_data_weight: 0.0
  # Odd-symmetry regularization on force map: F(-z, U_r) ~= -F(z, U_r)
  symmetry_weight: 0.0
  symmetry_norm: l2
  use_gradnorm: false
  gradnorm_alpha: 0.9
  gradnorm_min_weight: 0.001
  gradnorm_max_weight: 1000.0

runtime:
  device: cuda
  num_workers: 4

precision:
  use_tf32: false
  use_amp: false
  amp_dtype: bf16

compile:
  use_compile: false
  compile_mode: reduce-overhead

monitoring:
  rollout_every_epochs: 20
  validate_every_epochs: 20
  rollout_max_trajectories: 1
  cycle_validation_rollout: true
  # If true, validation metric sampling uses a fixed seed across epochs for stability.
  fixed_validation_sampling: false
  validation_sampling_seed: 1
  # If true and exactly one train_exclude_ur is configured, validation rollout
  # will target that excluded U_r.
  rollout_use_excluded_ur: false
  rollout_target_ur_tol: 1e-6
  final_rollout_all_validation: true
  log_every_epochs: 10
  print_every_epochs: 50
  log_component_grad_norms: false
  async_validation: true
  async_validation_device: cpu
  async_validation_num_workers: 0
  async_validation_num_threads: 1
  async_validation_max_concurrent: 6
  async_validation_do_losses: true
  async_validation_do_rollout: true

logging:
  run_dir_root: logs
  run_name: null
  append_timestamp: true

hnn: # file or compute
  velocity_source: file
  # Validation/final rollout sampling:
  # false -> deterministic drift-only rollout
  # true  -> stochastic momentum rollout using learned sigma_theta
  rollout_stochastic: true
  rollout_noise_scale: 1.0
  rollout_seed: null
  # Optional training-only U_r filtering when using generated series.
  # Validation loading is unchanged.
  train_include_ur: null
  train_exclude_ur: []
  train_ur_filter_tol: 1e-6
  # Per-trajectory normalization (PHNN): scale losses by per-trajectory RMS force.
  # Options: none | force_rms
  per_traj_norm: none
  per_traj_norm_eps: 1e-8
pinn: {}
