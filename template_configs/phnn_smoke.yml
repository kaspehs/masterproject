method: hnn

data:
  file: data.npz
  steadystate: false
  steadystate_time_threshold: 10.0
  cut_start_seconds: 5.0
  cut_start_seconds_train: 45.0
  cut_start_seconds_val: 45.0
  reduce_time: false
  reduction_factor: 1
  middle_time_plot: [15, 17]
  use_generated_train_series: true
  train_series_dir: Data_Gen/generated_series_Ur

model:
  rho: 1000.0
  D: 0.1
  structural_mass: 16.79
  Ca: 1.0
  k: 1218.0
  U: 0.65
  damping_c: 1e-4
  max_damping_ratio: 0.2
  force_output: coefficient
  # If enabled (with force_output=coefficient), apply:
  # C <- C_max * tanh(C / C_max)
  bound_force_coefficient: true
  force_coefficient_c_max: 5.0
  learn_hamiltonian: false
  discover_damping: false
  use_pirate_force: false
  pirate_force_kwargs: {}
  use_fourier_features: false
  fourier_features: 64
  fourier_sigma: 1.0
  use_feature_engineering: false
  ur_scale: 10.0

smoothing:
  use_savgol_smoothing: true
  window_length: 7
  polyorder: 3

architecture:
  # Options: residual | mlp | pirate | tcn
  force_net_type: residual
  residual_kwargs:
    hidden: 128
    layers: 3
    activation: gelu
  mlp_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  tcn_kwargs:
    # Set enabled/use_as_backbone=true to use TCN as temporal encoder before
    # residual/mlp/pirate head (when force_net_type is not "tcn").
    enabled: false
    use_as_backbone: false
    hidden: 128
    # First block dilation. Full stack becomes: dilation_start * [1, 2, 4, ...].
    dilation_start: 1
    levels: 4
    kernel_size: 3
    dropout: 0.0
    activation: gelu
    # Output feature width from TCN backbone before pointwise head.
    # If null, defaults to `hidden`.
    head_input_dim: null
    # Number of previous timesteps used as left context in PHNN force evaluation.
    history_len: 64
  pirate_force_kwargs:
    depth: 2
    fourier_features: 64
    sigma: 0.5
    use_rwf: false
    activation: gelu

training:
  batch_size: 8192
  max_grad_norm: 10000.0
  epochs: 2000

optim:
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  use_lr_scheduler: true
  scheduler:
    max_lr: 0.001
    decay_rate: 0.99
    warmup_fraction: 0.05
    min_lr: 0.0001
    scheduler_type: cosine

loss:
  # Options: srk4 (default) | implicit_euler
  physics_loss_discretization: srk4
  force_reg: 0.0001
  force_reg_on_coeff: true
  use_force_data_loss: false
  force_data_weight: 1.0
  use_gradnorm: false
  gradnorm_alpha: 0.9
  gradnorm_min_weight: 0.2
  gradnorm_max_weight: 5.0

runtime:
  device: cuda
  num_workers: 4

precision:
  use_tf32: false
  use_amp: false
  amp_dtype: bf16

compile:
  use_compile: false
  compile_mode: reduce-overhead

monitoring:
  rollout_every_epochs: 20
  validate_every_epochs: 20
  rollout_max_trajectories: 1
  cycle_validation_rollout: true
  final_rollout_all_validation: true
  # Toggle rollout NRMSE validation metrics.
  rollout_include_disp_nrmse: false
  rollout_include_force_nrmse: false
  # Toggle force-mapping NRMSE validation metric (and its extra compute).
  rollout_include_force_mapping_nrmse: true
  # Disable to skip per-U_r loss-map pass/logging.
  log_loss_vs_ur_map: true
  # Extra rollout metrics: dominant frequency relative error, amplitude relative error,
  # displacement/force spectral shape errors.
  log_extra_validation_metrics: true
  log_every_epochs: 10
  print_every_epochs: 50
  log_component_grad_norms: false
  async_validation: true
  async_validation_device: cpu
  async_validation_num_workers: 0
  async_validation_num_threads: 1
  async_validation_max_concurrent: 6
  async_validation_do_losses: true
  async_validation_do_rollout: true

logging:
  run_dir_root: logs
  run_name: null
  append_timestamp: true

hnn: # file or compute
  velocity_source: file
  # Optional training-only U_r filtering when using generated series.
  # Validation loading is unchanged.
  train_include_ur: null
  train_exclude_ur: []
  train_ur_filter_tol: 1e-6
pinn: {}

#For running all config files
#ls HNNconfigs/*.yml | xargs -P 2 -I{} python3 HNN.py --config {}
