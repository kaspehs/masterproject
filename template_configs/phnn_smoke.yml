method: hnn

data:
  cut_start_seconds_train: 0.0
  cut_start_seconds_val: 0.0
  # Optional temporal downsampling of TD trajectories.
  reduce_time: true
  reduction_factor: 5
  # Training default is effectively true when reduce_time=true and reduction_factor>1 if left null.
  stagger_reduced_time_train: null
  # Validation default is false.
  stagger_reduced_time_val: false
  train_series_dir: Data_Gen/npz_exports_td_burnin_trimmed

model:
  rho: 1.0
  D: 1.0
  structural_mass: 16.79
  Ca: 1.0
  k: 1218.0
  damping_c: 1e-4
  force_output: coefficient
  sigma_min: 1.0e-6
  ur_scale: 10.0

architecture:
  # If true, enforce odd force symmetry by construction: f(-state, U_r) = -f(state, U_r).
  # Requires hnn.use_td_force_input: false.
  hard_force_symmetry: false
  use_fourier_features: false
  fourier_features: 64
  fourier_sigma: 1.0
  force_net_type: mlp
  residual_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  mlp_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  pirate_force_kwargs:
    depth: 1
    fourier_features: 64
    sigma: 1.0
    use_rwf: false
    activation: gelu

training:
  batch_size: 1024
  max_grad_norm: 20.0
  epochs: 2000

optim:
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  use_lr_scheduler: true
  scheduler:
    max_lr: 0.001
    decay_rate: 0.99
    warmup_fraction: 0.05
    min_lr: 0.0001
    scheduler_type: cosine

loss:
  # Regularization
  mean_reg: 0.0
  mean_reg_norm: l1
  sigma_reg: 0.0
  sigma_reg_norm: l2
  fhat_reg: 0.0
  fhat_reg_norm: l2

  # U_r-bin normalization
  ur_bin_size: 1.0e-6
  normalize_by_ur_bin_std: false
  ur_bin_scale_eps: 1.0e-6

  # Rollout loss
  rollout_det_weight: 0.0
  rollout_det_steps: 0
  # Rollout loss mode: deterministic | stochastic_nll | stochastic_mse
  rollout_loss_mode: deterministic
  # Number of stochastic rollout samples K. Must be >= 2 for stochastic_nll/stochastic_mse.
  rollout_stochastic_samples: 1
  rollout_det_steps_final: 0
  rollout_det_steps_warmup_epochs: 0
  rollout_det_batch_size: 0
  # Auxiliary rollout displacement PSD loss using area-normalized spectra.
  rollout_disp_psd_weight: 0.0
  # Optional narrowbanding around the ground-truth dominant displacement peak.
  # 0.0 disables narrowbanding and compares the full non-DC spectrum.
  rollout_disp_psd_peak_rel_bandwidth: 0.0

  # Data / symmetry losses
  use_force_data_loss: false
  force_data_weight: 0.0
  symmetry_weight: 0.0
  symmetry_norm: l2

  # GradNorm balancing
  use_gradnorm: false
  gradnorm_alpha: 0.9
  gradnorm_min_weight: 0.001
  gradnorm_max_weight: 1000.0

runtime:
  device: cuda
  num_workers: 4

precision:
  use_tf32: false
  use_amp: false
  amp_dtype: bf16

compile:
  use_compile: false
  compile_mode: reduce-overhead

monitoring:
  validate_every_epochs: 50
  validation_samples_per_ur: 2
  final_rollout_all_validation: true
  log_every_epochs: 10
  print_every_epochs: 50
  log_component_grad_norms: false
  async_validation: true
  async_validation_device: cpu
  async_validation_num_workers: 0
  async_validation_num_threads: 1
  async_validation_max_concurrent: 6

logging:
  run_dir_root: logs
  run_name: null
  append_timestamp: true

hnn:
  # TD-correction mode: learn a correction on top of the exported Vivana-TD baseline.
  td_cv: 1.2
  td_cd: 1.1
  td_ca: 1.0
  td_fhat0: 0.18
  td_fhat_min: 0.11
  td_fhat_max: 0.26
  td_n_memory: 500
  # TD memory handling:
  # fixed_n_memory -> use td_n_memory directly
  # fixed_tau -> use n_memory = td_memory_tau_s / dt
  # tau_over_tref -> use tau = td_tau_over_tref * D / (td_fhat0 * U), then n_memory = tau / dt
  td_memory_mode: tau_over_tref
  td_tau_over_tref: 4.0
  td_memory_tau_s: null
  # If true, learn sigma on the correction force/coefficient output head.
  # Legacy compatibility field; correction_mode is the primary switch.
  predict_sigma: false
  # Unified TD correction output mode:
  # mean_only | mean_sigma_only | fhat_only | mean_fhat_only | mean_sigma_fhat
  correction_mode: mean_only
  # If true, include the current Vivana-TD predicted force as an extra force-network input.
  # Invalid for correction_mode values that include fhat correction.
  use_td_force_input: false
  # Phase-input selector for TD hidden-state inputs:
  # false -> disabled, true/phi_vy -> sin/cos(phi_vy_td), theta -> sin/cos(theta_td)
  use_phi_input: false
  # If true, append both normalized TD sigma states:
  # sigma_dy/(omega D) and sigma_ddy/(omega^2 D).
  use_sigma_inputs: false
  # One-step state loss: mse | propagated_nll
  state_loss_mode: mse
  # Bounded delta_fhat range extension multiplier. 1.0 means the strict physical band.
  fhat_bound_multiplier: 1.5

  # Final-layer init for TD-correction heads only: mu_corr and, when enabled, sigma_corr.
  # Only the output layer is zero/tiny-initialized; hidden layers keep standard random init.
  corr_init_mode: zero
  corr_init_tiny_std: 1.0e-4

  # Optional pretrained initialization for PHNN training.
  init_from_checkpoint: null
  # Freeze individual TD-correction subnetworks after model init / checkpoint load.
  freeze_mean_net: false
  freeze_fhat_net: false
  freeze_sigma_net: false

  # Debug / structural convention
  # Debug option: force the correction head output to zero so validation reduces to pure Vivana-TD.
  force_zero_output: false
  # Structural mass used in TD-correction mode: dry | effective
  td_mass_source: dry

  # Rollout behavior
  # Validation/final rollout sampling:
  # false -> deterministic drift-only rollout
  # true  -> stochastic correction rollout using learned sigma_corr
  rollout_stochastic: false
  rollout_noise_scale: 1.0
  rollout_seed: null

pinn: {}
