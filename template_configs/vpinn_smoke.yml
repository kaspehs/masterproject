method: vpinn

data:
  # Use the same training-series setup as `HNNrunconfigs/pirate_smoke.yml`.
  file: data.npz
  cut_start_seconds: 0.0
  cut_start_seconds_train: 0.0
  cut_start_seconds_val: 0.0
  use_generated_train_series: true
  train_series_dir: Data_Gen/npz_exports_td_burnin_trimmed
  reduce_time: true
  reduction_factor: 5

model:
  rho: 1.0
  D: 1.0
  structural_mass: 16.79
  Ca: 1.0
  k: 1218.0
  damping_c: 1e-4

smoothing:
  # Only used when vpinn.velocity_source=compute
  use_savgol_smoothing: true
  window_length: 7
  polyorder: 3

architecture:
  # Used when `vpinn.use_architecture_config: true`
  force_net_type: mlp
  residual_kwargs:
    hidden: 128
    layers: 3
    activation: gelu
  mlp_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  pirate_force_kwargs:
    depth: 2
    fourier_features: 64
    sigma: 0.5
    use_rwf: false
    activation: gelu

training:
  batch_size: 1024
  max_grad_norm: 20.0
  epochs: 200

optim:
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  use_lr_scheduler: true
  scheduler:
    max_lr: 0.001
    warmup_fraction: 0.05
    min_lr: 0.0001
    scheduler_type: cosine

runtime:
  device: cuda
  num_workers: 4

precision:
  use_tf32: false
  use_amp: false
  amp_dtype: bf16

compile:
  use_compile: false
  compile_mode: default

logging:
  run_dir_root: logs
  run_name: null
  append_timestamp: true


monitoring:
  # Logging / validation cadence
  log_every_epochs: 5
  print_every_epochs: 50
  validate_every_epochs: 10

  # Rollout validation plots (dynamics check)
  rollout_every_epochs: 10
  rollout_max_trajectories: 1
  cycle_validation_rollout: false
  # If true, validation metric sampling uses a fixed seed across epochs for stability.
  fixed_validation_sampling: true
  validation_sampling_seed: 1
  validation_samples_per_ur: 2
  final_rollout_all_validation: true
  async_validation: true
  async_validation_device: cpu
  async_validation_num_workers: 0
  async_validation_num_threads: 1
  async_validation_max_concurrent: 6
  async_validation_do_losses: true
  async_validation_do_rollout: true
  # If true and exactly one train_exclude_ur is configured, validation rollout
  # targets that excluded U_r from the validation set (if available).
  rollout_use_excluded_ur: true
  rollout_target_ur_tol: 1e-6

vpinn:
  # TD-correction mode: learn a correction on top of the exported Vivana-TD baseline.
  use_td_correction: true
  predict_sigma: false
  # Debug option: force the correction head output to zero so validation reduces to pure Vivana-TD.
  force_zero_output: false
  # Structural mass used in TD-correction mode: dry | effective
  td_mass_source: dry
  # Loss toggles
  use_force_loss: true
  use_weak_loss: true
  use_gradnorm: true
  gradnorm_alpha: 0.9
  gradnorm_eps: 1.0e-8
  gradnorm_min_weight: 0.001
  gradnorm_max_weight: 1000.0
  gradnorm_update_every_steps: 10
  window_M: 10
  stride: 2
  val_fraction: 0.0
  split_seed: 0
  wf: 1.0
  ww: 1.0
  # Optional short rollout force loss (applied every N batches).
  rollout_force_weight: 0.0
  rollout_force_steps: 0
  rollout_force_every: 1
  # Test functions for weak residual: polynomials (degree 0..num_poly_test-1) and sines (k=1..num_sine_test).
  # If num_poly_test is omitted, it defaults to 2 (degree 0 and 1).
  num_poly_test: 3
  num_sine_test: 0

  # Network architecture
  # If true, uses the shared `architecture:` block (force_net_type + *_kwargs) like HNN.
  # If false, uses vpinn.hidden_dim/depth/activation below.
  use_architecture_config: true

  # Network
  hidden_dim: 128
  depth: 2
  activation: tanh

  # Data interpretation
  # Generated series contain x and f, but not dy, so we compute v from x.
  velocity_source: file
  # Optional VPINN-specific rollout plotting window [start_s, end_s].
  # Overrides data.middle_time_plot when set.
  middle_time_plot: [15, 17]
  # Optional training-only U_r filtering when using generated series.
  # Validation loading is unchanged.
  train_include_ur: null
  train_exclude_ur: [5.75]
  train_ur_filter_tol: 1e-6
  use_data_file_for_validation: true
  validation_only_data_file: true

  # Input/output scaling (recommended): x/D, v/(sqrt(k/m)D), U_r/ur_scale, and f_scale=kD.
  use_input_scaling: true
  ur_scale: 10.0

  # Force representation: "force" (default) or "coefficient" (C = F/F0).
  force_representation: coefficient
