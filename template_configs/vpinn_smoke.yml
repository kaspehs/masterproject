method: vpinn

data:
  # Use the same training-series setup as `HNNrunconfigs/pirate_smoke.yml`.
  file: data.npz
  cut_start_seconds: 2.0
  cut_start_seconds_train: 45.0
  cut_start_seconds_val: 45.0
  use_generated_train_series: true
  train_series_dir: Data_Gen/generated_series_Ur_60
  reduce_time: true
  reduction_factor: 100

model:
  rho: 1000.0
  D: 0.1
  structural_mass: 16.79
  Ca: 1.0
  k: 1218.0
  damping_c: 1e-4

smoothing:
  # Only used when vpinn.velocity_source=compute
  use_savgol_smoothing: true
  window_length: 7
  polyorder: 3

architecture:
  # Used when `vpinn.use_architecture_config: true`
  # Options: residual | mlp | pirate | tcn
  force_net_type: residual
  residual_kwargs:
    hidden: 128
    layers: 3
    activation: gelu
  mlp_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  tcn_kwargs:
    # If true (and force_net_type is residual/mlp/pirate), run TCN first and then
    # feed its per-timestep features into that head network.
    enabled: false
    hidden: 128
    # Output feature width from TCN backbone into the head network.
    # Defaults to `hidden` if omitted.
    head_input_dim: 128
    levels: 4
    kernel_size: 3
    dropout: 0.0
    activation: gelu
    # Number of previous timesteps used as left context.
    # Defaults to vpinn.window_M if omitted.
    history_len: 64
  pirate_force_kwargs:
    depth: 2
    fourier_features: 64
    sigma: 0.5
    use_rwf: false
    activation: gelu

training:
  batch_size: 8192
  max_grad_norm: 10000.0
  epochs: 2000

optim:
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  use_lr_scheduler: true
  scheduler:
    max_lr: 0.001
    warmup_fraction: 0.05
    min_lr: 0.0001
    scheduler_type: cosine

runtime:
  device: cuda
  num_workers: 4

precision:
  use_tf32: false
  use_amp: false
  amp_dtype: bf16

compile:
  use_compile: false
  compile_mode: default

logging:
  run_dir_root: logs
  run_name: null
  append_timestamp: true


monitoring:
  # Logging / validation cadence
  log_every_epochs: 10
  print_every_epochs: 50
  validate_every_epochs: 20

  # Rollout validation plots (dynamics check)
  rollout_every_epochs: 20
  rollout_max_trajectories: 1
  cycle_validation_rollout: true
  final_rollout_all_validation: true
  async_validation: true
  async_validation_device: cpu
  async_validation_num_workers: 0
  async_validation_num_threads: 1
  async_validation_max_concurrent: 6
  async_validation_do_losses: true
  async_validation_do_rollout: true

vpinn:
  # Loss toggles
  use_force_loss: true
  use_weak_loss: true
  use_gradnorm: true
  gradnorm_alpha: 0.9
  gradnorm_eps: 1.0e-8
  gradnorm_min_weight: 000.1
  gradnorm_max_weight: 1000.0
  gradnorm_update_every_steps: 10
  window_M: 10
  stride: 2
  val_fraction: 0.0
  split_seed: 0
  wf: 1.0
  ww: 1.0
  # Optional short rollout force loss (applied every N batches).
  rollout_force_weight: 0.0
  rollout_force_steps: 0
  rollout_force_every: 1
  # If >0, computes rollout loss on a random sub-batch of this size to reduce GPU memory.
  # 0 means use the full training batch.
  rollout_force_batch_size: 0
  # Test functions for weak residual: polynomials (degree 0..num_poly_test-1) and sines (k=1..num_sine_test).
  # If num_poly_test is omitted, it defaults to 2 (degree 0 and 1).
  num_poly_test: 3
  num_sine_test: 0

  # Per-trajectory normalization: divide each window loss by a per-trajectory RMS scale.
  # Options: none | force_rms | residual_rms
  per_traj_norm: none
  per_traj_norm_eps: 1e-8

  # Network architecture
  # If true, uses the shared `architecture:` block (force_net_type + *_kwargs) like HNN.
  # If false, uses vpinn.hidden_dim/depth/activation below.
  use_architecture_config: true

  # Network
  hidden_dim: 128
  depth: 2
  activation: tanh

  # Data interpretation
  # Generated series contain x and f, but not dy, so we compute v from x.
  velocity_source: file
  # Optional VPINN-specific rollout plotting window [start_s, end_s].
  # Overrides data.middle_time_plot when set.
  middle_time_plot: [15, 17]
  # Optional training-only U_r filtering when using generated series.
  # Validation loading is unchanged.
  train_include_ur: null
  train_exclude_ur: []
  train_ur_filter_tol: 1e-6
  use_data_file_for_validation: true
  validation_only_data_file: true

  # Input/output scaling (recommended): x/D, v/(sqrt(k/m)D), U_r/ur_scale, and f_scale=kD.
  use_input_scaling: true
  ur_scale: 10.0

  # Force representation: "force" (default) or "coefficient" (C = F/F0).
  force_representation: coefficient
