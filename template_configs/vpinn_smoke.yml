method: vpinn

data:
  cut_start_seconds_train: 0.0
  cut_start_seconds_val: 0.0
  train_series_dir: Data_Gen/npz_exports_td_burnin_trimmed
  reduce_time: true
  reduction_factor: 5

model:
  rho: 1.0
  D: 1.0
  structural_mass: 16.79
  Ca: 1.0
  k: 1218.0
  damping_c: 1e-4

architecture:
  # VPINN always uses the shared architecture block below.
  use_fourier_features: false
  fourier_features: 64
  fourier_sigma: 1.0
  force_net_type: mlp
  residual_kwargs:
    hidden: 128
    layers: 3
    activation: gelu
  mlp_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  pirate_force_kwargs:
    depth: 2
    fourier_features: 64
    sigma: 0.5
    use_rwf: false
    activation: gelu

training:
  batch_size: 1024
  max_grad_norm: 20.0
  epochs: 200

optim:
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  use_lr_scheduler: true
  scheduler:
    max_lr: 0.001
    warmup_fraction: 0.05
    min_lr: 0.0001
    scheduler_type: cosine

loss:
  # Active losses
  use_force_loss: true
  use_weak_loss: true

  # Windowing / weak-form setup
  window_M: 10
  stride: 2
  wf: 1.0
  ww: 1.0
  num_poly_test: 3
  num_sine_test: 0

  # Regularization
  mean_reg: 0.0
  mean_reg_norm: l1
  sigma_reg: 0.0
  sigma_reg_norm: l2

  # U_r-bin normalization
  ur_bin_size: 1.0e-6
  normalize_by_ur_bin_std: false
  ur_bin_scale_eps: 1.0e-6

  # Rollout loss
  rollout_det_weight: 0.0
  rollout_det_steps: 0
  # Rollout loss mode: deterministic | stochastic_nll | stochastic_mse
  rollout_loss_mode: deterministic
  # Number of stochastic rollout samples K. Must be >= 2 for stochastic_nll/stochastic_mse.
  rollout_stochastic_samples: 1
  # Optional linear rollout-length schedule. <=0 keeps rollout_det_steps fixed.
  rollout_det_steps_final: 0
  rollout_det_steps_warmup_epochs: 0
  rollout_det_batch_size: 0

  # GradNorm balancing
  use_gradnorm: true
  gradnorm_alpha: 0.9
  gradnorm_eps: 1.0e-8
  gradnorm_min_weight: 0.001
  gradnorm_max_weight: 1000.0
  gradnorm_update_every_steps: 10

runtime:
  device: cuda
  num_workers: 4

precision:
  use_tf32: false
  use_amp: false
  amp_dtype: bf16

compile:
  use_compile: false
  compile_mode: default

logging:
  run_dir_root: logs
  run_name: null
  append_timestamp: true


monitoring:
  # Logging / validation cadence
  log_every_epochs: 5
  print_every_epochs: 50
  validate_every_epochs: 10

  # Rollout validation plots (dynamics check)
  validation_samples_per_ur: 2
  final_rollout_all_validation: true
  async_validation: true
  async_validation_device: cpu
  async_validation_num_workers: 0
  async_validation_num_threads: 1
  async_validation_max_concurrent: 6

vpinn:
  # TD-correction mode: learn a correction on top of the exported Vivana-TD baseline.
  predict_sigma: false
  # If true, include the current Vivana-TD predicted force as an extra force-network input.
  use_td_force_input: false

  # Final-layer init for TD-correction heads only: mu_corr and, when enabled, sigma_corr.
  # Only the output layer is zero/tiny-initialized; hidden layers keep standard random init.
  corr_init_mode: zero
  corr_init_tiny_std: 1.0e-4

  # Debug / structural convention
  # Debug option: force the correction head output to zero so validation reduces to pure Vivana-TD.
  force_zero_output: false
  # Structural mass used in TD-correction mode: dry | effective
  td_mass_source: dry

  # Rollout behavior
  # Validation/final rollout sampling:
  # false -> deterministic correction rollout
  # true  -> stochastic correction rollout using learned sigma_corr
  rollout_stochastic: false
  rollout_noise_scale: 1.0
  rollout_seed: null

  # Scaling / force convention
  # Input scaling (recommended): x/D, v/(sqrt(k/m)D), U_r/ur_scale.
  # In force mode the wrapper uses f_scale=kD; in coefficient mode it outputs C_F directly.
  use_input_scaling: true
  ur_scale: 10.0
  # Force representation: "force" (default) or "coefficient" (C = F/F0).
  force_representation: coefficient
