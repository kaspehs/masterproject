method: correction

data:
  downsample: true  # downsample TD trajectories before training
  downsample_factor: 20
  dataset_root: vivana_cfd_data_pipeline/generated/final_dataset

model:
  fluid_density: 1.0
  diameter: 1.0
  # Scaling convention: structural_frequency uses structural scales; convective uses flow scales.
  input_scaling_basis: structural_frequency  # structural_frequency | convective
  reduced_velocity_scale: 10.0  # only used with structural_frequency scaling
  correction_strategy: combined  # force | frequency | combined
  # TD-correction input features.
  td_force_input_source: none  # none | total | fcv
  use_baseline_frequency_input: true
  phase_input_source: both  # none | phi_vy | theta | both
  use_memory_std_inputs: false
  use_acceleration_input: false

constraints:
  force_coefficient_bound: 2.0  # tanh cap on force-coefficient output
  force_regularization_weight: 1e-2
  force_regularization_norm: l2  # l1 | l2
  frequency_regularization_weight: 1e-1
  frequency_regularization_norm: l1  # l1 | l2
  frequency_bound_base_interval: null  # null uses VIVANA-TD fhat interval
  frequency_bound_multiplier: 2.0  # 1.0 gives the strict baseline interval
  debug_zero_correction_output: false  # debug: true reduces validation to pure VIVANA-TD

architecture:
  backbone_type: pirate
  residual_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  mlp_kwargs:
    hidden: 128
    layers: 2
    activation: gelu
  pirate_kwargs:
    depth: 2
    fourier_features: 32
    sigma: 0.5
    activation: silu

training:
  batch_size: 2048
  max_grad_norm: 200.0
  epochs: 500
  output_init_mode: standard  # zero | tiny | standard
  output_init_tiny_std: 1.0e-4

optim:
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  use_lr_scheduler: true
  scheduler:
    max_lr: 0.0003
    decay_rate: 0.99
    warmup_fraction: 0.05
    min_lr: 0.00003
    scheduler_type: cosine

loss:
  one_step_state_weight: 1.0  # set 0.0 to disable one-step state loss

  multi_step_state_weight: 0.0
  rollout_horizon_steps: 400
  rollout_det_steps_final: 0
  rollout_det_steps_warmup_epochs: 0
  rollout_batch_size: 2048
  multi_step_amplitude_weight: 1.0
  rollout_disp_std_p: 2.0  # exponent for displacement std error
  rollout_disp_mean_in_std_loss: true  # include displacement mean error with std loss
  multi_step_frequency_weight: 1.0
  multi_step_frequency_loss: dominant_frequency  # spectral_amplitude | dominant_frequency
  frequency_loss_peak_relative_bandwidth: 0.0  # 0.0 compares full non-DC spectrum
  frequency_loss_use_hann_window: true
  dominant_frequency_p: 2.0  # exponent for dominant-frequency error
  dominant_frequency_peak_alpha: 4.0  # PSD peak-concentration exponent

  use_gradient_normalization: true
  gradnorm_alpha: 0.9
  gradnorm_min_weight: 0.001
  gradnorm_max_weight: 1000.0

runtime:
  device: cpu
  num_workers: 4

precision:
  use_tf32: false
  use_amp: false
  amp_dtype: bf16

compile:
  use_compile: false
  compile_mode: reduce-overhead

logging:
  run_dir_root: logs
  run_name: null
  append_timestamp: true
  validate_every_epochs: 20
  log_every_epochs: 5
  print_every_epochs: 50
  log_component_grad_norms: false
  async_validation: true
  async_validation_device: cpu
  async_validation_num_workers: 0
  async_validation_num_threads: 1
  async_validation_max_concurrent: 6

vivana_td:
  cv: 1.2
  cd: 1.1
  ca: 1.0
  fhat0: 0.18
  fhat_min: 0.11
  fhat_max: 0.26
  n_memory: 500
  # tau_over_tref uses tau = tau_over_tref * D / (fhat0 * U).
  memory_mode: tau_over_tref  # fixed_n_memory | fixed_tau | tau_over_tref
  tau_over_tref: 4.0
  memory_tau_s: null
